on:
  workflow_dispatch: 

jobs:
  actions-cache:
    name: Mateo actions cache example
    runs-on: ubuntu-slim
    steps:
      - name: Restore cache
        id: restore-cache
        uses: actions/cache@v5
        with:
          path: mateo
          key: awesome-key
      
      - name: Populate cache on miss
        if: ${{ !steps.restore-cache.outputs.cache-hit  }}
        run: |
          echo "Missed cache, generated trash cache"
          mkdir mateo
          date > mateo/mateo.txt

      - name: Save cache
        if: steps.restore-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: mateo
          key: awesome-key

      - name: Verify cache status
        run: |
          echo "cache-hit? -> ${{ steps.restore-cache.outputs.cache-hit }}"
          cat mateo/mateo.txt

